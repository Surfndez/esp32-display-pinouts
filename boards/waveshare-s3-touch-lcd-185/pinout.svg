x="1184" y="478" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">I2C (GPIO 11 / 10)</text><text x="634" y="508" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Address</text><text x="1184" y="508" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">0x6B</text><text x="634" y="568" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">RTC - PCF85063</text><rect width="550" height="2" x="634" y="582" fill="#0b7d4e"/><rect width="566" height="30" x="626" y="584" fill="#f4f7f5" rx="6"/><text x="634" y="602" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Bus</text><text x="1184" y="602" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">I2C (GPIO 11 / 10)</text><text x="634" y="632" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Address</text><text x="1184" y="632" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">0x51</text><rect width="1128" height="122" x="56" y="706" fill="#fdf7e8" rx="10"/><text x="76" y="730" fill="#8a6412" font-family="Montserrat" font-size="15" font-weight="700">Check your revision</text><text x="76" y="754" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">Pins from Waveshare&apos;s demo code and schematic</text><text x="76" y="776" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">(https://files.waveshare.com/wiki/ESP32-S3-Touch-LCD-1.85/ESP32-S3-Touch-LCD-1.85-Demo.zip). SD D3/CS: the schematic&apos;s pin table</text><text x="76" y="798" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">and the wiki put it on Extend_IO3 (TCA9554 P2), but the Arduino demo&apos;s SD_Card.cpp toggles EXIO_PIN4 (P3, which the schematic gives</text><text x="76" y="820" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">to