<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="664" viewBox="0 0 1240 664"><rect width="1240" height="664" fill="#fff"/><rect width="1240" height="8" x="0" y="0" fill="#0b7d4e"/><text x="56" y="66" fill="#0b7d4e" font-family="Montserrat" font-size="15" font-weight="700" letter-spacing="3">LCD WIZARD · PINOUT</text><text x="56" y="104" fill="#0d1513" font-family="Montserrat" font-size="30" font-weight="700">Waveshare ESP32-S3-LCD-0.85</text><text x="56" y="130" fill="#4a5a55" font-family="Montserrat" font-size="16" font-weight="500">ESP32-S3 · GC9107 128 x 128 · GFX Library for Arduino · 16-bit colour</text><rect width="1128" height="1" x="56" y="162" fill="#dbe3df"/><text x="56" y="196" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">Panel - SPI (4-wire serial)</text><rect width="550" height="2" x="56" y="210" fill="#0b7d4e"/><rect width="566" height="30" x="48" y="212" fill="#f4f7f5" rx="6"/><text x="56" y="230" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">SCK / CLK</text><text x="606" y="230" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 38</text><text x="56" y="260" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">MOSI / SDA</text><text x="606" y="260" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 39</text><rect width="566" height="30" x="48" y="272" fill="#f4f7f5" rx="6"/><text x="56" y="290" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">CS</text><text x="606" y="290" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 21</text><text x="56" y="320" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">DC / RS</text><text x="606" y="320" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 45</text><rect width="566" height="30" x="48" y="332" fill="#f4f7f5" rx="6"/><text x="56" y="350" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">RESET</text><text x="606" y="350" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 40</text><text x="634" y="196" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">Backlight</text><rect width="550" height="2" x="634" y="210" fill="#0b7d4e"/><rect width="566" height="30" x="626" y="212" fill="#f4f7f5" rx="6"/><text x="634" y="230" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Pin</text><text x="1184" y="230" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 46</text><text x="634" y="260" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Active</text><text x="1184" y="260" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">high</text><rect width="566" height="30" x="626" y="272" fill="#f4f7f5" rx="6"/><text x="634" y="290" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Drive</text><text x="1184" y="290" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">PWM 5000 Hz</text><text x="634" y="350" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">I2C (GPIO 42 / 41)</text><rect width="550" height="2" x="634" y="364" fill="#0b7d4e"/><rect width="566" height="30" x="626" y="366" fill="#f4f7f5" rx="6"/><text x="634" y="384" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">SDA</text><text x="1184" y="384" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 42</text><text x="634" y="414" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">SCL</text><text x="1184" y="414" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 41</text><rect width="1128" height="100" x="56" y="462" fill="#fdf7e8" rx="10"/><text x="76" y="486" fill="#8a6412" font-family="Montserrat" font-size="15" font-weight="700">Check your revision</text><text x="76" y="510" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">Pins from Waveshare&apos;s demo code and schematic (https://github.com/waveshareteam/ESP32-S3-LCD-0.85). The docs call it a &apos;capacitive</text><text x="76" y="532" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">LCD&apos; and xiaozhi defines TOOUCH_INT 48 / TOOUCH_RST 47, but the schematic&apos;s LCD FPC has 12 pins and no touch lines, GPIO48 is the</text><text x="76" y="554" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">WS2812 data line and no demo reads touch - recorded touch null.</text><text x="56" y="608" fill="#687570" font-family="Montserrat" font-size="14" font-weight="500">Generated from the LCD Wizard board preset &quot;waveshare-s3-lcd-085&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" y="632" fill="#0b7d4e" font-family="Montserrat" font-size="14" font-weight="700" text-anchor="end">lcdwizard.com/boards/waveshare-s3-lcd-085</text></svg>