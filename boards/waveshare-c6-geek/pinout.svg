<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="622" viewBox="0 0 1240 622"><rect width="1240" height="622" fill="#fff"/><rect width="1240" height="8" x="0" y="0" fill="#0b7d4e"/><text x="56" y="66" fill="#0b7d4e" font-family="Montserrat" font-size="15" font-weight="700" letter-spacing="3">LCD WIZARD · PINOUT</text><text x="56" y="104" fill="#0d1513" font-family="Montserrat" font-size="30" font-weight="700">Waveshare ESP32-C6-GEEK</text><text x="56" y="130" fill="#4a5a55" font-family="Montserrat" font-size="16" font-weight="500">ESP32-C6 · ST7789 135 x 240 · GFX Library for Arduino · 16-bit colour</text><rect width="1128" height="1" x="56" y="162" fill="#dbe3df"/><text x="56" y="196" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">Panel - SPI (4-wire serial)</text><rect width="550" height="2" x="56" y="210" fill="#0b7d4e"/><rect width="566" height="30" x="48" y="212" fill="#f4f7f5" rx="6"/><text x="56" y="230" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">SCK / CLK</text><text x="606" y="230" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 1</text><text x="56" y="260" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">MOSI / SDA</text><text x="606" y="260" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 2</text><rect width="566" height="30" x="48" y="272" fill="#f4f7f5" rx="6"/><text x="56" y="290" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">CS</text><text x="606" y="290" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 5</text><text x="56" y="320" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">DC / RS</text><text x="606" y="320" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 3</text><rect width="566" height="30" x="48" y="332" fill="#f4f7f5" rx="6"/><text x="56" y="350" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">RESET</text><text x="606" y="350" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 4</text><text x="634" y="196" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">Backlight</text><rect width="550" height="2" x="634" y="210" fill="#0b7d4e"/><rect width="566" height="30" x="626" y="212" fill="#f4f7f5" rx="6"/><text x="634" y="230" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Pin</text><text x="1184" y="230" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 6</text><text x="634" y="260" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Active</text><text x="1184" y="260" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">high</text><rect width="566" height="30" x="626" y="272" fill="#f4f7f5" rx="6"/><text x="634" y="290" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Drive</text><text x="1184" y="290" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">PWM 5000 Hz</text><rect width="1128" height="122" x="56" y="398" fill="#fdf7e8" rx="10"/><text x="76" y="422" fill="#8a6412" font-family="Montserrat" font-size="15" font-weight="700">Check your revision</text><text x="76" y="446" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">Pins from Waveshare&apos;s demo code and schematic (https://github.com/waveshareteam/ESP32-C6-GEEK (commit</text><text x="76" y="468" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">e9ea5866ff87bef10fd2bcac07dc57a1004264d0; example/ESP32-C6-GEEK-Demo = V1, example/ESP32-C6-GEEK_V2-Demo = V2)). Two hardware</text><text x="76" y="490" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">revisions: V2 (shipping from 2026-03-23, &apos;V2&apos; on the back) puts the TF card on the LCD&apos;s SPI bus (SCK 1, MOSI 2, MISO 20, CS 23);</text><text x="76" y="512" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">V1 had the TF card on its own pins (SCK 19, MOSI 18, MISO 20, CS 23).</text><text x="56" y="566" fill="#687570" font-family="Montserrat" font-size="14" font-weight="500">Generated from the LCD Wizard board preset &quot;waveshare-c6-geek&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" y="590" fill="#0b7d4e" font-family="Montserrat" font-size="14" font-weight="700" text-anchor="end">lcdwizard.com/boards/waveshare-c6-geek</text></svg>