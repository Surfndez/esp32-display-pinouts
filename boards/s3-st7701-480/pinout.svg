<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="758" viewBox="0 0 1240 758"><rect width="1240" height="758" fill="#fff"/><rect width="1240" height="8" x="0" y="0" fill="#0b7d4e"/><text x="56" y="66" fill="#0b7d4e" font-family="Montserrat" font-size="15" font-weight="700" letter-spacing="3">LCD WIZARD · PINOUT</text><text x="56" y="104" fill="#0d1513" font-family="Montserrat" font-size="30" font-weight="700">ESP32-S3 + ST7701S 480x480 round</text><text x="56" y="130" fill="#4a5a55" font-family="Montserrat" font-size="16" font-weight="500">ESP32-S3 · ST7701 / ST7701S 480 x 480 · GFX Library for Arduino · 16-bit colour</text><rect width="1128" height="1" x="56" y="162" fill="#dbe3df"/><text x="56" y="196" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">Panel - RGB565 parallel (DPI)</text><rect width="550" height="2" x="56" y="210" fill="#0b7d4e"/><rect width="566" height="30" x="48" y="212" fill="#f4f7f5" rx="6"/><text x="56" y="230" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">DE</text><text x="606" y="230" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 18</text><text x="56" y="260" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">VSYNC</text><text x="606" y="260" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 17</text><rect width="566" height="30" x="48" y="272" fill="#f4f7f5" rx="6"/><text x="56" y="290" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">HSYNC</text><text x="606" y="290" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 16</text><text x="56" y="320" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">PCLK</text><text x="606" y="320" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 21</text><rect width="566" height="30" x="48" y="332" fill="#f4f7f5" rx="6"/><text x="56" y="350" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">R0 - R4</text><text x="606" y="350" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 4, 3, 2, 1, 0</text><text x="56" y="380" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">G0 - G5</text><text x="606" y="380" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 10, 9, 8, 7, 6, 5</text><rect width="566" height="30" x="48" y="392" fill="#f4f7f5" rx="6"/><text x="56" y="410" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">B0 - B4</text><text x="606" y="410" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 15, 14, 13, 12, 11</text><text x="56" y="440" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">CS (init only)</text><text x="606" y="440" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 39</text><rect width="566" height="30" x="48" y="452" fill="#f4f7f5" rx="6"/><text x="56" y="470" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">SCK (init only)</text><text x="606" y="470" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 48</text><text x="56" y="500" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">MOSI (init only)</text><text x="606" y="500" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 47</text><rect width="566" height="30" x="48" y="512" fill="#f4f7f5" rx="6"/><text x="56" y="530" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">RESET</text><text x="606" y="530" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">-</text><text x="634" y="196" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">Touch - CST328</text><rect width="550" height="2" x="634" y="210" fill="#0b7d4e"/><rect width="566" height="30" x="626" y="212" fill="#f4f7f5" rx="6"/><text x="634" y="230" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">SDA</text><text x="1184" y="230" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 19</text><text x="634" y="260" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">SCL</text><text x="1184" y="260" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 45</text><rect width="566" height="30" x="626" y="272" fill="#f4f7f5" rx="6"/><text x="634" y="290" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">INT / IRQ</text><text x="1184" y="290" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 40</text><text x="634" y="320" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">RESET</text><text x="1184" y="320" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 41</text><text x="634" y="380" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">Backlight</text><rect width="550" height="2" x="634" y="394" fill="#0b7d4e"/><rect width="566" height="30" x="626" y="396" fill="#f4f7f5" rx="6"/><text x="634" y="414" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Pin</text><text x="1184" y="414" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 38</text><text x="634" y="444" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Active</text><text x="1184" y="444" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">high</text><rect width="566" height="30" x="626" y="456" fill="#f4f7f5" rx="6"/><text x="634" y="474" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Drive</text><text x="1184" y="474" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">PWM 5000 Hz</text><rect width="1128" height="78" x="56" y="578" fill="#fdf7e8" rx="10"/><text x="76" y="602" fill="#8a6412" font-family="Montserrat" font-size="15" font-weight="700">Check your revision</text><text x="76" y="626" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">CS/SCK/MOSI carry the ST7701 init commands only; pixels go over the RGB bus. The init sequence is the type 1 one; a panel that</text><text x="76" y="648" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">stays black on a board wired like this usually wants a different type.</text><text x="56" y="702" fill="#687570" font-family="Montserrat" font-size="14" font-weight="500">Generated from the LCD Wizard board preset &quot;s3-st7701-480&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" y="726" fill="#0b7d4e" font-family="Montserrat" font-size="14" font-weight="700" text-anchor="end">lcdwizard.com/boards/s3-st7701-480</text></svg>