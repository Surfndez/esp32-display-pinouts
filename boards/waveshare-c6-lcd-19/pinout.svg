<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="754" viewBox="0 0 1240 754"><rect width="1240" height="754" fill="#fff"/><rect width="1240" height="8" x="0" y="0" fill="#0b7d4e"/><text x="56" y="66" fill="#0b7d4e" font-family="Montserrat" font-size="15" font-weight="700" letter-spacing="3">LCD WIZARD · PINOUT</text><text x="56" y="104" fill="#0d1513" font-family="Montserrat" font-size="30" font-weight="700">Waveshare ESP32-C6-LCD-1.9</text><text x="56" y="130" fill="#4a5a55" font-family="Montserrat" font-size="16" font-weight="500">ESP32-C6 · ST7789 170 x 320 · GFX Library for Arduino · 16-bit colour</text><rect width="1128" height="1" x="56" y="162" fill="#dbe3df"/><text x="56" y="196" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">Panel - SPI (4-wire serial)</text><rect width="550" height="2" x="56" y="210" fill="#0b7d4e"/><rect width="566" height="30" x="48" y="212" fill="#f4f7f5" rx="6"/><text x="56" y="230" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">SCK / CLK</text><text x="606" y="230" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 5</text><text x="56" y="260" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">MOSI / SDA</text><text x="606" y="260" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 4</text><rect width="566" height="30" x="48" y="272" fill="#f4f7f5" rx="6"/><text x="56" y="290" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">MISO / SDO</text><text x="606" y="290" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 19</text><text x="56" y="320" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">CS</text><text x="606" y="320" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 7</text><rect width="566" height="30" x="48" y="332" fill="#f4f7f5" rx="6"/><text x="56" y="350" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">DC / RS</text><text x="606" y="350" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 6</text><text x="56" y="380" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">RESET</text><text x="606" y="380" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 14</text><text x="56" y="440" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">I2C (GPIO 18 / 8)</text><rect width="550" height="2" x="56" y="454" fill="#0b7d4e"/><rect width="566" height="30" x="48" y="456" fill="#f4f7f5" rx="6"/><text x="56" y="474" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">SDA</text><text x="606" y="474" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 18</text><text x="56" y="504" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">SCL</text><text x="606" y="504" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 8</text><text x="634" y="196" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">Backlight</text><rect width="550" height="2" x="634" y="210" fill="#0b7d4e"/><rect width="566" height="30" x="626" y="212" fill="#f4f7f5" rx="6"/><text x="634" y="230" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Pin</text><text x="1184" y="230" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">GPIO 15</text><text x="634" y="260" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Active</text><text x="1184" y="260" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">low</text><rect width="566" height="30" x="626" y="272" fill="#f4f7f5" rx="6"/><text x="634" y="290" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Drive</text><text x="1184" y="290" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">PWM 5000 Hz</text><text x="634" y="350" fill="#0d1513" font-family="Montserrat" font-size="17" font-weight="700">TCA9554 (I/O expander)</text><rect width="550" height="2" x="634" y="364" fill="#0b7d4e"/><rect width="566" height="30" x="626" y="366" fill="#f4f7f5" rx="6"/><text x="634" y="384" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Type</text><text x="1184" y="384" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">TCA9554</text><text x="634" y="414" fill="#4a5a55" font-family="Montserrat" font-size="15" font-weight="500">Address</text><text x="1184" y="414" fill="#0d1513" font-family="Montserrat" font-size="15" font-weight="700" text-anchor="end">0x20</text><rect width="1128" height="100" x="56" y="552" fill="#fdf7e8" rx="10"/><text x="76" y="576" fill="#8a6412" font-family="Montserrat" font-size="15" font-weight="700">Check your revision</text><text x="76" y="600" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">Pins from Waveshare&apos;s demo code and schematic (https://files.waveshare.com/wiki/ESP32-C6-LCD-1.9/ESP32-C6-LCD-1.9-Demo-V2.zip).</text><text x="76" y="622" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">Invert: 08_LVGL_Test and ESP-IDF 07_LVGL_Test send 0x21 (INVON), while 07_Hello_World_GFX builds Arduino_ST7789 with ips=false;</text><text x="76" y="644" fill="#6b5312" font-family="Montserrat" font-size="15" font-weight="500">chose invert=true from the LVGL demo&apos;s explicit register table (typical of this 170x320 IPS glass) - verify on hardware.</text><text x="56" y="698" fill="#687570" font-family="Montserrat" font-size="14" font-weight="500">Generated from the LCD Wizard board preset &quot;waveshare-c6-lcd-19&quot;. Pins as the designer writes them into lcd_pins.h.</text><text x="1184" y="722" fill="#0b7d4e" font-family="Montserrat" font-size="14" font-weight="700" text-anchor="end">lcdwizard.com/boards/waveshare-c6-lcd-19</text></svg>